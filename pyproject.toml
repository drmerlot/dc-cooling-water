[project]
name = "dc-cooling-water"
version = "0.1.0"
description = "Weather-driven data center cooling water model with Monte Carlo uncertainty, xarray output, dask ensembles and a CSDMS Basic Model Interface (BMI)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Andrew Sommerlot" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "xarray>=2023.1",
  "dask[array]>=2023.1",
  "bmipy>=2.0",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_cooling_water"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
