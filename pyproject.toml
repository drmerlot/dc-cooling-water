[project]
name = "dc-cooling-water"
version = "0.1.0"
description = "Weather-driven data center cooling water models (cooling towers, closed loop, lake-source) with Monte Carlo uncertainty, xarray output, dask ensembles, STAC/zarr publishing and CSDMS Basic Model Interfaces (BMI)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Andrew Sommerlot" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "xarray>=2023.1",
  "dask[array]>=2023.1",
  "bmipy>=2.0",
  "pyyaml>=6",
]

[project.optional-dependencies]
stac = ["pystac>=1.10", "zarr>=2.16"]
test = ["pytest>=7", "pystac>=1.10", "zarr>=2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_cooling_water"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
