name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reproduction:
        description: "Also download the West Michigan weather record and check reproduction of Water Ledger"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q

  reproduction:
    if: github.event_name == 'workflow_dispatch' && inputs.reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: DCW_FETCH=1 pytest -q tests/test_regression.py
